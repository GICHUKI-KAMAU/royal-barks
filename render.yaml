services:
  - type: web
    name: royal-barks-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:migrate:postgres && npm run build
    startCommand: npm run start --workspace API
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_SSL
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: "None"
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
